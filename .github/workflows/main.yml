name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{secrets.SSH_USERNAME}}
          passphrase: ${{secrets.SSH_PASSPHRASE}}
          script: |
            cd /home/image-metadata-management-system  
            #Start the SSH agent
            eval $(ssh-agent -s)
            # Add the private key using the passphrase from secrets
            echo "${{ secrets.HUB_SSH_PASSPHRASE }}" | ssh-add /root/.ssh/for_github_repo_access
            git pull git@github.com:roberthobblebottom/lkcnhm_image_metadata_management_system.git origin main

            echo 'Deployment sucessful to digital ocean'  

            
