name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{secrets.SSH_USERNAME}}
          # passphrase: ${{secrets.SSH_PASSPHRASE}}
          script: |
            cd /home/image-metadata-management-system  
            git clone git@github.com:roberthobblebottom/lkcnhm-image-metadata-management-system.git  
            echo 'Deployment sucessful to digital ocean'  

            
